project:
  type: default
  output-dir: _output

format:
  html:
    toc: true
    toc-depth: 3
    theme: default
  pdf:
    documentclass: article
    geometry: margin=1in
    keep-tex: true
  docx: default

engine: knitr
execute:
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: ""
    message: false
    warning: false
    fig.align: "center"