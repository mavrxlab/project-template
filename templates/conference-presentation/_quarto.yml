project:
  type: default
  output-dir: _output

format:
  revealjs:
    theme: default
    slide-number: true
    chalkboard: 
      buttons: false
    preview-links: auto
    transition: slide
    background-transition: fade
  beamer:
    theme: default
    colortheme: default
    fonttheme: default
  pptx:
    reference-doc: custom-template.pptx

# Citation settings
bibliography: references.bib
# Use live Zotero Style Repository (with local backup)
csl: https://www.zotero.org/styles/apa  # Fallback: assets/apa.csl

engine: knitr
execute:
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: ""
    message: false
    warning: false
    fig.align: "center"