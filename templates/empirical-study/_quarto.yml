project:
  type: default
  output-dir: _output
  execute-dir: project

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    theme: default
  pdf:
    documentclass: article
    geometry: margin=1in
    keep-tex: true
  docx:
    reference-doc: custom-reference.docx
  # Academic-style formats (basic versions)
  # For full APA compliance, consider: https://github.com/wjschne/apaquarto
  apa-style:
    format: pdf
    documentclass: article
    fontsize: 12pt
    linestretch: 2
    geometry: margin=1in
    csl: https://www.zotero.org/styles/apa
    
  # For full IEEE compliance, consider: https://github.com/Mellich/quarto-ieee
  ieee-style:
    format: pdf
    documentclass: article
    fontsize: 10pt
    geometry: margin=0.75in
    columns: 2
    csl: https://www.zotero.org/styles/ieee
    
  nature-style:
    format: pdf
    documentclass: article
    fontsize: 10pt
    geometry: margin=0.75in
    csl: https://www.zotero.org/styles/nature

# Citation settings
bibliography: references.bib
# Use live Zotero Style Repository (with local backup)
csl: https://www.zotero.org/styles/apa  # Fallback: assets/apa.csl

engine: knitr
execute:
  echo: false
  warning: false
  message: false
  cache: false

knitr:
  opts_chunk:
    comment: ""
    message: false
    warning: false
    fig.align: "center"
    fig.width: 8
    fig.height: 6