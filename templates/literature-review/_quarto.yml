project:
  type: default
  output-dir: _output

format:
  html:
    toc: true
    toc-depth: 3
    code-fold: true
    theme: default
  pdf:
    documentclass: article
    geometry: margin=1in
    keep-tex: true
  docx:
    reference-doc: custom-reference.docx

# Citation settings
bibliography: references.bib
# Use live Zotero Style Repository (with local backup)
csl: https://www.zotero.org/styles/apa  # Fallback: assets/apa.csl

engine: knitr
execute:
  echo: false
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: ""
    message: false
    warning: false