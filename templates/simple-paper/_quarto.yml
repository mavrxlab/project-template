project:
  type: default

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    css: styles.css
  
  pdf:
    documentclass: article
    geometry: 
      - margin=1in
    fontsize: 12pt
    linestretch: 1.5
    number-sections: true
    colorlinks: true
    
  docx:
    reference-doc: template.docx
    number-sections: true
    
  # Academic-style formats (basic versions)
  # For full APA compliance, consider: https://github.com/wjschne/apaquarto
  apa-style:
    format: pdf
    documentclass: article
    fontsize: 12pt
    linestretch: 2
    geometry: margin=1in
    csl: https://www.zotero.org/styles/apa
    
  # For full IEEE compliance, consider: https://github.com/Mellich/quarto-ieee  
  ieee-style:
    format: pdf
    documentclass: article
    fontsize: 10pt
    geometry: margin=0.75in
    columns: 2
    csl: https://www.zotero.org/styles/ieee
    
  nature-style:
    format: pdf
    documentclass: article
    fontsize: 10pt
    geometry: margin=0.75in
    csl: https://www.zotero.org/styles/nature

# Citation settings
bibliography: references.bib
# Use live Zotero Style Repository (with local backup)
csl: https://www.zotero.org/styles/apa  # Fallback: assets/apa.csl

# Execution settings
execute:
  echo: false
  warning: false
  message: false
  cache: false

# Cross-reference settings
crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  fig-prefix: "Figure"
  tbl-prefix: "Table"